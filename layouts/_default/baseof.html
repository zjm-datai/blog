<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <nav aria-label="主导航"><a href="{{ "/" | relURL }}">首页</a></nav>
    </div>
  </header>
  <main class="container page-content">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer"><div class="container">{{ site.Title }} · {{ now.Year }}</div></footer>
</body>
</html>
