{{ define "main" }}
<article class="article">
  <a class="back-link" href="{{ "/" | relURL }}">← 返回文章列表</a>
  <header class="article-header">
    <p class="post-date">{{ .Date.Format "2006-01-02" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  <div class="article-body">{{ .Content }}</div>
</article>
{{ end }}
